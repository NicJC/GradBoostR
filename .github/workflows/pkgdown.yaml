name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pkgdown:
    name: Build and deploy pkgdown site
    runs-on: ubuntu-latest

    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlib

    steps:
      - uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libstdc++-13-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Prepare R library
        run: |
          mkdir -p "${R_LIBS_USER}"
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); print(.libPaths())'

      - name: Install pkgdown, vignette and preview packages
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); install.packages(c("pak","pkgdown","ggplot2","tidyr","knitr","rmarkdown","nanonext"), repos="https://cloud.r-project.org")'
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); pak::local_install_deps(upgrade = TRUE)'

      - name: Install compiled dependencies
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); install.packages(c("Rcpp","RcppArmadillo"), repos="https://cloud.r-project.org")'

      - name: Install GradBoostR with pak
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); pak::local_install(".", upgrade = TRUE)'

      - name: Verify installation
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); print(.libPaths()); print(requireNamespace("pkgdown", quietly=TRUE)); print("GradBoostR" %in% rownames(installed.packages()))'

      - name: Build pkgdown site
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); pkgdown::build_site()'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
