name: pkgdown

on:
  push:
    branches: [main]

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Debug directory structure
        run: |
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -R .

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++ \
            libstdc++-13-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R dependencies (explicit)
        run: |
          Rscript -e 'install.packages(c("pak","pkgdown","ggplot2","tidyr","knitr","rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Install compiled dependencies
        run: |
          Rscript -e 'install.packages(c("Rcpp","RcppArmadillo"), repos = "https://cloud.r-project.org")'

      - name: Install package (local) with pak
        run: |
          Rscript -e 'pak::local_install(".", upgrade = TRUE)'

      - name: Verify package installed
        run: |
          Rscript -e 'cat("R library paths:\\n"); print(.libPaths()); cat("\\nInstalled packages (grep GradBoostR):\\n"); print(installed.packages()[grepl("^GradBoostR$", installed.packages()[,"Package"]), c("Package","LibPath")])'

      - name: Build site
        run: |
          Rscript -e 'pkgdown::build_site()'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
