name: pkgdown

on:
  push:
    branches: [main]

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ runner.temp }}/Rlib

    steps:
      - uses: actions/checkout@v3

      - name: Debug directory structure
        run: |
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -R .

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libstdc++-13-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Prepare R library
        run: |
          mkdir -p "${R_LIBS_USER}"
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); cat("libPaths after prep:\\n"); print(.libPaths())'

      - name: Install pkgdown, preview and vignette packages (non-interactive)
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); install.packages(c("pak","pkgdown","ggplot2","tidyr","knitr","rmarkdown","nanonext"), repos="https://cloud.r-project.org")'
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); pak::local_install_deps(upgrade = TRUE)'

      - name: Install compiled dependencies
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); install.packages(c("Rcpp","RcppArmadillo"), repos="https://cloud.r-project.org")'

      - name: Install package into same library with pak
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); pak::local_install(".", upgrade = TRUE)'

      - name: Verify pkgdown and GradBoostR installed
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); cat("libPaths:\\n"); print(.libPaths()); cat("\\npkgdown present: "); print(requireNamespace("pkgdown", quietly=TRUE)); if (requireNamespace("pkgdown", quietly=TRUE)) print(packageVersion("pkgdown")); cat("\\nGradBoostR installed: "); print("GradBoostR" %in% rownames(installed.packages())); print(installed.packages()[grepl("^GradBoostR$", installed.packages()[,"Package"]), c("Package","LibPath")])'

      - name: Build site
        run: |
          Rscript -e '.libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths())); pkgdown::build_site()'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs


