name: pkgdown

on:
  push:
    branches: [main]

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Debug directory structure
        run: |
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -R .

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libstdc++-13-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies (pkgdown + vignette)
        run: |
          Rscript -e 'install.packages(c("pak","pkgdown","ggplot2","tidyr","knitr","rmarkdown"), repos = "https://cloud.r-project.org")'
          Rscript -e 'pak::local_install_deps(upgrade = TRUE)'

      - name: Install compiled dependencies
        run: |
          Rscript -e 'install.packages(c("Rcpp","RcppArmadillo"), repos = "https://cloud.r-project.org")'

      - name: Install package with pak
        run: |
          Rscript -e 'pak::local_install(".", upgrade = TRUE)'

      - name: Verify pkgdown and package installed
        run: |
          Rscript -e 'cat("pkgdown present: "); print(requireNamespace("pkgdown", quietly=TRUE)); if (requireNamespace("pkgdown", quietly=TRUE)) print(packageVersion("pkgdown"))'
          Rscript -e 'cat("GradBoostR installed: "); print("GradBoostR" %in% rownames(installed.packages())); print(installed.packages()[grepl("^GradBoostR$", installed.packages()[,"Package"]), c("Package","LibPath")])'
          Rscript -e 'cat("Library paths:\\n"); print(.libPaths())'

      - name: Build site
        run: |
          Rscript -e 'pkgdown::build_site()'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
