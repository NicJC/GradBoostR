name: Build Vignette

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vignette:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::tidyr
            any::Rcpp
            any::RcppArmadillo

      - name: Install package
        run: |
          R CMD INSTALL .

      - name: Build vignette
        run: |
          mkdir -p docs

          Rscript -e "rmarkdown::render(
            'vignettes/GradBoostR.Rmd',
            output_file='index.html',
            output_dir='docs'
          )"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
